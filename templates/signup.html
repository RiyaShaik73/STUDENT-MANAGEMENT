{% extends "base.html" %}
{% set title = "Signup" %}
{% block content %}
<main class="auth-shell">
    <form class="auth-card" method="post">
        <p class="eyebrow">New student</p>
        <h1>Create your account</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <label>Full Name<input name="name" placeholder="Enter your name" required></label>
        <label>Email<input type="email" name="email" placeholder="student@example.com" required></label>
        <label>Password<input type="password" name="password" placeholder="Create password" required></label>
        <label>City<input name="city" placeholder="Your city"></label>
        <button type="submit">Signup and View Dashboard</button>
        <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </form>
</main>
{% endblock %}
